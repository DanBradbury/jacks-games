# Deploys only when this game (or code it bundles) changes on main.
name: Deploy punchline

on:
  push:
    branches: [main]
    paths:
      - games/punchline/**
      - packages/kit/**
      - tsconfig.base.json
      - .github/workflows/deploy-punchline.yml
      - .github/workflows/deploy-game.yml
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy-game.yml
    with:
      game: punchline
    secrets: inherit
