# Reusable deploy job: builds one game, runs the Playables checks, then
# deploys its dist/ to Cloudflare Workers with that game's wrangler.jsonc.
# Called by the per-game deploy-<game>.yml workflows.
name: Deploy game

on:
  workflow_call:
    inputs:
      game:
        description: Folder name under games/
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Never run two deploys of the same game at once; the newest push wins.
    concurrency:
      group: deploy-${{ inputs.game }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build + Playables checks
        run: npm run package -w @jack-games/${{ inputs.game }}
      - name: Deploy to Cloudflare
        working-directory: games/${{ inputs.game }}
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
