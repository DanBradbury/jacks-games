<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101715"><title>The Last Fill · Field Recordings</title>
  <script defer src="https://www.youtube.com/game_api/v1"></script>
</head>
<body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg">
  <symbol id="play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="pause" viewBox="0 0 24 24"><path d="M8 5v14m8-14v14" stroke-width="4"/></symbol>
  <symbol id="expand" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></symbol>
  <symbol id="sound" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zM16 8q4 4 0 8m3-11q7 7 0 14"/></symbol>
  <symbol id="mute" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zM16 9l6 6m0-6-6 6"/></symbol>
  <symbol id="back" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></symbol>
</svg>
<main id="app">
  <div id="screen"></div>
  <div id="cover"></div><div class="shade"></div><div class="grain"></div>
  <header>
    <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Field Recordings</div>
    <nav><button id="audio" aria-label="Mute sound" title="Toggle sound"><svg><use href="#sound"/></svg><span>Sound on</span></button><button id="full" aria-label="Enter fullscreen" title="Fullscreen"><svg><use href="#expand"/></svg></button></nav>
  </header>
  <section class="intro">
    <div class="kicker"><b></b> Interactive short film</div>
    <h1>The Last <em>Fill.</em></h1>
    <p>A late-night stop for gas. An empty stretch of highway.<br class="wide"> Something moving above the pasture.</p>
    <button id="begin"><svg><use href="#play"/></svg><span>Begin experience</span></button>
    <p id="status" role="status"></p>
  </section>
  <footer class="index"><div class="index-head"><span>Scene index</span><span>Runtime &nbsp; 00:48</span></div>
    <div class="chapters">
      <button data-start="0"><small>01</small><span>The station</span><time>00:00</time></button>
      <button data-start="13"><small>02</small><span>The forecourt</span><time>00:13</time></button>
      <button data-start="28"><small>03</small><span>The encounter</span><time>00:28</time></button>
    </div>
  </footer>
  <div class="transport" hidden>
    <button id="exit" aria-label="Return to title"><svg><use href="#back"/></svg></button>
    <button id="toggle" aria-label="Pause"><svg><use href="#pause"/></svg></button>
    <span id="chapter"></span><input id="seek" type="range" min="0" max="48" value="0" step=".1" aria-label="Scene time"><time id="clock">00:00</time>
  </div>
</main>
<script type="module" src="./src/main.js"></script>
</body></html>
